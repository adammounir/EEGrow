# Root config. A run picks one of each group (dataset/model/eval) via defaults or CLI.
# Override anything on the CLI, e.g.  train.max_epochs=2  model=grow_sccnet  eval=cross_subject
defaults:
  - dataset: bnci2014_001
  - model: grow_sccnet
  - eval: cross_subject
  - align: none
  - _self_

seed: 42

# Band-pass of the MOABB paradigm (motor-imagery default 8-32 Hz).
paradigm:
  fmin: 8
  fmax: 32

# Shared deep-learning training knobs (ignored by the ML arms). Global so a smoke
# test is just `train.max_epochs=2`.
train:
  lr: 6.25e-4
  max_epochs: 200
  batch_size: 64
  # Which epoch's model gets scored (`selection_monitor`) and what ends the fit
  # (`stop_monitor`). Both were implicitly `valid_acc` before, and both were wrong for
  # the same reason: on internal validation splits this small (46 trials on
  # bnci2014_001, 3 on shin2017a) accuracy moves in steps of 1/n_valid, which is 300x
  # coarser than skorch's improvement threshold -- so the tolerance never fires and the
  # run ends when a quantised metric fails to beat whichever early epoch got lucky.
  # Worse, nothing restored the best model at all: `EarlyStopping.load_best` defaults
  # to False and `EEGClassifier` ships no `Checkpoint`, so every score this benchmark
  # published came from the model `patience` epochs PAST its own best -- measured at
  # exactly 20, std 0.0, on all 140 490 folds of v5.
  #
  # `*_loss` => lower is better, anything else => higher is better.
  #
  # BOTH ARE SETTLED SINCE, and the values below are the LOSING ones. The A/B ran
  # (`exp_deep4_budget.py`, 36 paired units, then SLURM 500573 over all 9 arms) and the
  # 2x2 square reads::
  #
  #                       sel=valid_loss   sel=valid_acc
  #     patience  20          0.3501           0.3390
  #     patience 200          0.4074           0.4818
  #
  # The two knobs interact (+0.0854, p=1.1e-07), so neither can be set alone: the
  # corrected protocol is `patience=200` AND `selection_monitor=valid_acc` together.
  # `stop_monitor: valid_loss` is right as it stands -- the loss is continuous, so
  # patience actually fires on it. It is `selection_monitor` that has to move: the two
  # full-budget cells have bit-identical trajectories and differ only in which epoch is
  # handed back, and the loss hands back epoch 5 where the accuracy peak is at 158.
  #
  # The defaults stay wrong on purpose -- flipping them re-dates every score in
  # `results_v5_published/`, which is still the reference frame for the archived
  # figures. So the corrected protocol is passed explicitly at launch::
  #
  #     train.patience=200 train.selection_monitor=valid_acc
  #
  # A grid submitted without those two overrides silently reproduces the undertrained
  # protocol -- no warning, well-formed CSVs -- and is worth up to +0.13 of accuracy on
  # `bd_deep4`. Check the `srun` line before submitting. Do NOT read these defaults as
  # the recommendation; they are the opposite.
  selection_monitor: valid_loss
  # Which of two tied epochs `RestoreBestModel` keeps. `earliest` is the historical
  # rule and, like the two knobs above, the losing one: on a quantised valid_acc a
  # lucky epoch 1-2 sets a plateau the trained net can only tie, so the strict
  # comparison hands back a barely-trained net (64 % of shin2017a probe fits scored
  # before epoch 5; 15 % under `latest`). Measured offline on 06/10/2026,
  # `analysis/restored_tie_rule/`. But `latest` breaks the other edge (07/10): after
  # memorisation valid_acc re-touches its max to the end, and 23-49 % of fits get
  # scored in the last 5 epochs. Neither value is the fix; `smooth_window` below is.
  tie_break: earliest
  # Select on the centred rolling mean of `selection_monitor` over this many epochs
  # (odd; 1 = no smoothing, the historical rule). An isolated lucky epoch is diluted by
  # its neighbours, a trained plateau is not, so both tie edges close at once: W=5 puts
  # bnci2014_001 at 0 % early / 10 % late (offline 07/10, `smooth_rule.py`; live 13/10,
  # `restored_tie_rule/live/`: 90/90 fits restore the epoch the offline rule picks,
  # grow_shallow 0/10 %, bd_deep4 2/19 %, +0.009/+0.013 test acc over `earliest`).
  # Caveat from the same run: at patience 200 the LAST epoch scores as well or better
  # (grow_shallow +0.009), so smoothing earns its place as the restored_epoch MEASURE
  # more than as a performance gain. New work passes `train.smooth_window=5` with the
  # two overrides above. It does not rescue tiny splits: below n_valid ~ 8 no rule
  # passes, which is why the deep campaign refuses datasets with n_valid < 16.
  smooth_window: 1
  # Whether the net is SCORED at the selected epoch (true, historical) or at its last
  # epoch (false). The deep campaign passes false (decided 13/10): at patience 200 the
  # last epoch scores as well or better than any selection on a 46-trial split, and
  # keeping selection out of the score stops the restored_epoch predictor and the
  # accuracy it is controlled for from sharing the same validation noise. The
  # selection still runs and is recorded as `selected_epoch`.
  restore_selected: true
  # Save the selected module's weights per fit (`<cell>__fits__selected/<fit_uid>.pt`)
  # so the selected-epoch score stays recoverable offline when the last epoch is
  # scored. Any score read from them is exploratory, never the primary endpoint.
  save_selected: false
  # Fraction of each fold set aside for the growth line search, carved from the
  # TRAINING side for every arm (fixed ones just never read it), so all arms train on
  # the same trials; the validation split is unchanged. 0.0 = historical: the line
  # search ran on already-trained batches, or on the statistics batches themselves on
  # 92.7 % of the previous campaign's events. The deep campaign passes 0.1 (decided
  # 13/10, `analysis/step0_catalogue/line_search_censoring.py`).
  growth_holdout: 0.0
  # Line-search amplitudes; null = the historical {0, 0.1, 0.5, 1}, whose top wins on
  # 97.8-100 % of applied steps (censored). The deep campaign passes
  # "[0.0,0.25,0.5,1.0,2.0,4.0]" (eegrow.training.loop.WIDE_SCALING_GRID).
  scaling_grid: null
  # gromo `normalize_optimal_updates` type applied to a growth step before its line
  # search, e.g. "match_extending_layer" (each component rescaled to the std of the
  # layer it extends). null = historical: sqrt(singular value) baked into the new
  # weights, ~1e-2 amplitude, and the line search stays linear in s (step 0,
  # addendum 1, RESULTAT_step0_training_battery.md). Exploratory until an addendum.
  growth_normalization: null
  # 20/10 attribution controls (loop.grow_step): apply this s on every growth step
  # whatever the line search says; restore the growing layer's per-channel norms after
  # each step (function-preserving through the following BatchNorm). null/false = off.
  growth_fixed_s: null
  growth_rescale: false
  # Model recipe (validation campaign 21/10, CATALOGUE § 5): adamw|adam, [b1, b2] or
  # null (torch default), amsgrad. Defaults = every historical cell. growth_normalization
  # also takes "tiny_paper" (TINY App. E.3.1, needs growth_fixed_s: 1.0 = the paper).
  optimizer: adamw
  betas: null
  amsgrad: false
  stop_monitor: valid_loss
  # Epochs without improvement on `stop_monitor` before the fit ends. null => the
  # historical max(15, max_epochs//10) = 20. Set it >= max_epochs to disable early
  # stopping outright, which is the only way to measure what a net would have reached
  # if simply left to train -- on `bd_deep4` the difference is not academic, its
  # validation loss bottoms at epoch 4 and patience 20 ends the fit at epoch 24 while
  # the train loss is still descending. Same caveat as `selection_monitor` above: `null`
  # is the historical value, not the advice -- new work passes `train.patience=200`.
  patience: null
  # Learning-rate schedule: null (constant, what the whole v5 grid ran) or `cosine`.
  # KEEP IT null. The knob exists because it was a live hypothesis and it was tested;
  # the test says the schedule HURTS. On the 2x2 budget/selection square (bnci2014_001
  # within_session, 36 paired units) cosine scores 0.4276 against 0.4818 for the
  # constant lr once both are given the full budget.
  #
  # Two hypotheses died on the way there, both worth keeping so they are not re-run.
  # (1) Gradient steps per epoch: Spearman(batches/epoch, final train loss) = 0.095.
  # (2) "bd_deep4 is the only net that cannot fit its own training data" -- median
  # final train loss 0.24 against 0.009 for `fix_deepeeg`, which read as instability
  # and motivated annealing. That was an artefact of `patience` above, not a property
  # of the net: at full budget the same net reaches 0.1366 against 1.1874 at the early
  # stop. There was no capacity problem to anneal away.
  #
  # T_max is `max_epochs`, i.e. the schedule is written for the full budget, so a
  # cosine arm that stops early has spent only the flat top and decayed by ~20% --
  # which is why the two arms were indistinguishable (+0.0018) at patience 20 and only
  # separated once `patience >= max_epochs` let the cosine actually anneal (lr_final
  # 0.0000). Read `lr_final` on the fit record before concluding a schedule did
  # nothing.
  lr_schedule: null
  # AdamW's denominator is `sqrt(v_hat_i) + eps`, so `eps` silently caps the step of
  # any coordinate whose second moment falls below it -- the hypothesis for why the
  # deep arms sit at chance on the small datasets. Torch's default, written down so it
  # can be swept (`train.optimizer_eps=1e-6`). Do NOT raise it on the hypothesis alone:
  # the `adam_eps_frac` column on every fit record measures the fraction of
  # coordinates where it actually bites, and that measurement decides.
  optimizer_eps: 1e-8
  # AdamW weight decay. 0.01 is torch's AdamW default, which is what every fit ran
  # under before this knob existed (it was never passed; the fit records' `optimizer`
  # stamp shows 0.01). braindecode's recipe: 0 for ShallowFBCSPNet, 5e-4 for Deep4Net
  # (examples/model_building/plot_bcic_iv_2a_moabb_trial.py, lines 233-238).
  weight_decay: 0.01

# MOABB does its own per-fold parallelism off; the sweep parallelises across jobs.
n_jobs: 1
overwrite: true
suffix: eegrow

# On-disk cache of the preprocessed epochs (MOABB `cache_config`). Every model and
# every seed on a dataset derives the *same* epochs from the raw files -- 70 identical
# filter+resample+epoch passes on a 14-model, 5-seed grid. Caching them makes the
# first job pay and the other 69 read. Off by default so a one-off run does not
# silently populate a shared directory; the campaign scripts turn it on.
cache:
  enabled: false
  # null => MNE_DATA. Point it at a shared path so the whole fleet hits one cache.
  path: null

# `profile_cell.py` only. Kept here so the profiler reuses the production config
# tree verbatim rather than a parallel copy that could drift from it.
profile:
  cache: ${cache.enabled}
  n_subjects: null      # truncate the subject list to bound a profiling run
  # Same anchor as the hydra dirs below, and for the same reason: the sbatch
  # scripts cd into benchmarks/, so the cwd form writes to benchmarks/benchmarks/.
  out_dir: ${oc.env:EEGROW_BENCH_ROOT,${hydra:runtime.cwd}/benchmarks}/profile

# Where per-job CSV/joblib land. null data_dir => MNE default ~/mne_data (local);
# on the cluster set data_dir to the shared cache (see config/dataset notes).
# null => benchmarks/results, located from the runner's own file (see
# utils.default_results_root). It used to be ${hydra:runtime.cwd}/benchmarks/results,
# which makes the destination depend on where the process was launched from -- and
# under slurm the sbatch script does not reliably control that. Set it explicitly to
# write elsewhere.
results_dir: null
data_dir: null

hydra:
  run:
    # The SLURM id is part of the name, not decoration. With a bare timestamp to the
    # second, two array tasks of the same job start in the same second, resolve to the
    # *same* directory and clobber each other's .hydra -- the run record of one of them
    # simply disappears. That is not hypothetical: it destroyed the provenance of
    # several cells of the production grid, after which the regime guard fell back to
    # an older superseded launch and reported its sampling rate as fact.
    # The sweep dir below never had the problem: its subdir is the override string, so
    # it is unique per cell by construction.
    #
    # EEGROW_BENCH_ROOT, not ${hydra:runtime.cwd}/benchmarks. The cwd form is the same
    # trap that sent an arm of the grid to benchmarks/benchmarks/results (see
    # utils.default_results_root): any script that cd's into benchmarks/ before running
    # -- which the packed runner and every sbatch here do -- resolves it one level too
    # deep. `results/` was anchored to the source file; the hydra records were not, so
    # the run records still landed somewhere no analysis looks. Losing those records is
    # precisely what cost this campaign its provenance, so they get an absolute anchor.
    dir: ${oc.env:EEGROW_BENCH_ROOT,${hydra:runtime.cwd}/benchmarks}/outputs/${now:%Y-%m-%d_%H-%M-%S}_${oc.env:SLURM_JOB_ID,local}
  sweep:
    dir: ${oc.env:EEGROW_BENCH_ROOT,${hydra:runtime.cwd}/benchmarks}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false
